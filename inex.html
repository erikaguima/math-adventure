<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Adventure — Star Valley</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#28334c}*{box-sizing:border-box}body{margin:0;background:#ecf4ff;min-height:100vh;display:grid;place-items:center;padding:14px}.shell{width:min(1060px,100%);background:#fff;border:2px solid #d1e4f6;border-radius:23px;box-shadow:0 20px 60px #304c7920;overflow:hidden}.top{padding:14px 21px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:clamp(19px,3vw,26px);margin:0;color:#2e5385}.status{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}.pill{border-radius:50px;background:#eff5ff;padding:8px 12px}.game{position:relative;background:#bce8ff}canvas{width:100%;height:auto;display:block;image-rendering:auto}.instructions{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;flex-wrap:wrap;font-size:13px}.instructions p{margin:0}.actions{display:flex;gap:8px}.btn{background:#2e6dc1;color:#fff;border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:14px}.btn:hover,.choice:hover{filter:brightness(.95)}.btn.secondary{background:#e7effc;color:#24508f}.overlay{position:absolute;inset:0;background:#102d51b9;display:none;align-items:center;justify-content:center;padding:15px}.overlay.active{display:flex}.modal{width:min(520px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 16px 60px #0018;text-align:center}.modal h2{font-size:clamp(22px,3.5vw,31px);margin:3px 0 8px;color:#224a7c}.modal p{margin:8px 0 16px;line-height:1.5}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#edf5ff;color:#264f80;border:2px solid #b7d1f3;border-radius:13px;padding:14px 5px;font-size:22px;font-weight:800;cursor:pointer;min-height:60px}.choice:focus-visible,.btn:focus-visible{outline:4px solid #ffce52}.choice.wrong{background:#ffe9ec;border-color:#e65c6c}.choice.correct{background:#d8f6de;border-color:#41a868}.feedback{min-height:23px;font-weight:700;margin-top:11px}.touch{display:flex;gap:9px;justify-content:center;padding:0 16px 16px}.touch button{touch-action:none;width:65px;height:55px;border:0;border-radius:14px;background:#d9e8ff;font-weight:bold;font-size:23px;color:#244a84}.touch button.jump{background:#ffda74}.touch button:active{transform:scale(.96)}.footer{font-size:12px;text-align:center;color:#687b97;padding:0 10px 13px}@media(min-width:850px){.touch{display:none}}@media(max-width:560px){.modal{padding:15px}.choices{gap:7px}.choice{min-height:52px}.top{padding:10px}.instructions{padding:10px}}
</style></head><body><main class="shell"><header class="top"><h1>🌟 Math Adventure: Star Valley</h1><div class="status"><span class="pill" id="levelText">Level 1 / 4</span><span class="pill" id="scoreText">⭐ 0</span><span class="pill" id="progressText">🧩 0 / 4</span></div></header><section class="game"><canvas id="screen" width="960" height="520" aria-label="A colorful platform adventure math game"></canvas><div class="overlay active" id="overlay"><div class="modal" id="modal"></div></div></section><section class="instructions"><p>⌨️ <b>Move:</b> ← → or A D &nbsp; <b>Jump:</b> ↑, W or Space &nbsp; <b>Interact:</b> walk up to a question box.</p><div class="actions"><button class="btn secondary" id="soundBtn">🔊 Sound on</button><button class="btn secondary" id="restartBtn">↻ Restart</button></div></section><div class="touch" aria-label="Touch controls"><button id="left" aria-label="Move left">◀</button><button id="jump" class="jump" aria-label="Jump">⬆</button><button id="right" aria-label="Move right">▶</button></div><div class="footer">Made for Year 2 • Numbers up to 100 • Addition, subtraction, time & money</div></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');const el=id=>document.getElementById(id);const W=960,H=520,ground=437;let world=0,score=0,answered=0,mode='start',sound=true,questionIdx=-1,wrong=0,last=0,cam=0,particles=[];const held={left:false,right:false,jump:false};const player={x:54,y:ground-49,w:35,h:49,vx:0,vy:0,onGround:false,face:1};const levels=[{name:'Sunny Meadow',sky:['#a8e0ff','#e6fbff'],hills:'#8dd1a6',floor:'#52b87c',questions:[{q:'What is 27 + 15?',options:['32','42','43','52'],answer:1,why:'27 + 10 = 37, then + 5 = 42.'},{q:'What is 64 − 28?',options:['36','46','42','34'],answer:0,why:'64 − 20 = 44, then − 8 = 36.'},{q:'What number comes after 79?',options:['78','80','89','70'],answer:1,why:'The next number after 79 is 80.'},{q:'What is 6 groups of 2?',options:['8','10','12','14'],answer:2,why:'2 + 2 + 2 + 2 + 2 + 2 = 12.'}]},{name:'Clockwork Forest',sky:['#b6e8cf','#edfff1'],hills:'#71bd96',floor:'#40946e',questions:[{q:'Half past 3 is…',options:['3:00','3:15','3:30','4:30'],answer:2,why:'Half past means 30 minutes after the hour.'},{q:'Quarter past 7 is…',options:['7:15','7:45','6:45','7:30'],answer:0,why:'Quarter past means 15 minutes after the hour.'},{q:'What time is 1 hour after 9:30?',options:['9:45','10:00','10:30','11:30'],answer:2,why:'One hour later: 10:30.'},{q:'How many minutes are in 1 hour?',options:['30','45','60','100'],answer:2,why:'1 hour = 60 minutes.'}]},{name:'Coin Canyon',sky:['#ffd8a7','#fff1d7'],hills:'#e4ab71',floor:'#c78d56',questions:[{q:'20p + 10p + 5p = ?',options:['25p','30p','35p','40p'],answer:2,why:'20 + 10 + 5 = 35p.'},{q:'You have £1. You spend 60p. How much is left?',options:['20p','30p','40p','60p'],answer:2,why:'£1 = 100p. 100 − 60 = 40p.'},{q:'Two 50p coins are worth…',options:['50p','75p','£1','£2'],answer:2,why:'50p + 50p = 100p = £1.'},{q:'A pencil costs 35p and an eraser 20p. Total?',options:['45p','55p','65p','50p'],answer:1,why:'35 + 20 = 55p.'}]},{name:'Crystal Castle',sky:['#c5d5ff','#eff4ff'],hills:'#aeb5e6',floor:'#777bc1',questions:[{q:'Fill the gap: 18, 28, 38, __',options:['39','40','48','58'],answer:2,why:'The pattern adds 10 each time.'},{q:'Which number is greatest?',options:['69','96','86','79'],answer:1,why:'96 is greater than the others.'},{q:'What is 100 − 47?',options:['43','53','63','57'],answer:1,why:'100 − 40 = 60, then − 7 = 53.'},{q:'There are 5 bags with 5 stars each. Total?',options:['15','20','25','30'],answer:2,why:'5 + 5 + 5 + 5 + 5 = 25.'}]}];const boxes=[290,750,1260,1790],coins=[165,210,485,565,960,1080,1480,1600,1880,2000],plats=[{x:470,y:352,w:170},{x:970,y:334,w:165},{x:1460,y:347,w:170}],worldEnd=2170;let collected=new Set(),solved=new Set();function updateHUD(){el('levelText').textContent=`Level ${world+1} / 4 · ${levels[world].name}`;el('scoreText').textContent=`⭐ ${score}`;el('progressText').textContent=`🧩 ${answered} / 4`;}function beep(freq=540,duration=.11){if(!sound)return;try{let a=beep.audio||(beep.audio=new(window.AudioContext||window.webkitAudioContext)());if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+duration)}catch(e){}}function open(html){mode='dialog';overlay.classList.add('active');modal.innerHTML=html;}function begin(){world=0;score=0;resetLevel();startIntro()}function startIntro(){open(`<div style="font-size:44px">🐻 🌟 🏰</div><h2>Welcome to Star Valley!</h2><p>Help <b>Math Bear</b> travel through four magical lands. Collect stars and solve four maths puzzles in each land to open the castle gate!</p><p>16 puzzles • 4 levels • Unlimited tries</p><button class="btn" id="playBtn">▶ Start adventure</button>`);el('playBtn').onclick=()=>{overlay.classList.remove('active');mode='play';beep(630)}}function resetLevel(){player.x=48;player.y=ground-player.h;player.vx=0;player.vy=0;cam=0;answered=0;collected=new Set();solved=new Set();particles=[];updateHUD()}function nextLevel(){world++;if(world>=levels.length){open(`<div style="font-size:58px">🏆🎉🌟</div><h2>You saved Star Valley!</h2><p>Fantastic work! You solved all <b>16 maths puzzles</b>.</p><p style="font-size:23px;font-weight:bold">Your score: ⭐ ${score}</p><button class="btn" id="again">Play again</button>`);el('again').onclick=begin;return;}resetLevel();open(`<div style="font-size:52px">🎊 🐻</div><h2>Level complete!</h2><p>Next adventure: <b>${levels[world].name}</b></p><button class="btn" id="go">Let's go!</button>`);el('go').onclick=()=>{overlay.classList.remove('active');mode='play'}}function challenge(idx){questionIdx=idx;wrong=0;showQuestion()}function showQuestion(){let q=levels[world].questions[questionIdx];open(`<div style="font-size:32px">📦 ✨</div><div style="font-weight:bold;color:#6c85a6">Challenge ${questionIdx+1} of 4</div><h2>${q.q}</h2><div class="choices">${q.options.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite">Choose an answer!</div>`);modal.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>answer(Number(btn.dataset.i),btn));}function answer(i,button){const q=levels[world].questions[questionIdx];if(i!==q.answer){wrong++;button.classList.add('wrong');el('feedback').textContent='Try again! You can do it 💛';beep(210,.15);setTimeout(()=>button.classList.remove('wrong'),420);return;}modal.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add('correct');let gain=Math.max(4,15-wrong*3);score+=gain;answered++;solved.add(questionIdx);updateHUD();beep(780,.12);el('feedback').innerHTML=`✅ Great job! ${q.why}<br>+${gain} stars`;setTimeout(()=>{overlay.classList.remove('active');mode='play';player.x=boxes[questionIdx]+67;if(answered===4){emit(player.x,player.y,25)}},1050)}function emit(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*6,life:40})}
function background(){let l=levels[world],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,l.sky[0]);g.addColorStop(1,l.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9d3';ctx.beginPath();ctx.arc(815,80,41,0,7);ctx.fill();for(let k=0;k<9;k++){let x=((k*220-cam*.17)%1320+1320)%1320-160;cloud(x,70+(k%3)*42)}for(let k=0;k<15;k++){let x=k*190-cam*.38;ctx.fillStyle=l.hills;ctx.beginPath();ctx.ellipse(x,ground+37,175,132,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle=l.floor;ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#77cb8b';if(world===2)ctx.fillStyle='#ddb080';if(world===3)ctx.fillStyle='#ada7e0';ctx.fillRect(0,ground,W,10);for(let k=0;k<65;k++){let x=((k*113-cam)%W+W)%W;ctx.fillStyle=k%3?'#ffffff66':'#ffe9a9';ctx.fillRect(x,ground+20+k%4*13,4,3)}}function cloud(x,y){ctx.fillStyle='#ffffffaa';for(let [a,b,r] of [[0,12,23],[27,0,29],[56,11,24]]){ctx.beginPath();ctx.arc(x+a,y+b,r,0,7);ctx.fill()}}function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function star(x,y,r=12){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd04b';ctx.strokeStyle='#efa829';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){let ang=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.48:r;ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}function bear(x,y){ctx.save();ctx.translate(x,y);ctx.scale(player.face,1);ctx.fillStyle='#91624f';for(let k of [-9,9]){ctx.beginPath();ctx.arc(k,-29,9,0,7);ctx.fill()}ctx.fillStyle='#b47c55';ctx.beginPath();ctx.ellipse(0,-16,17,22,0,0,7);ctx.fill();ctx.fillStyle='#e6b995';ctx.beginPath();ctx.ellipse(0,-6,10,11,0,0,7);ctx.fill();ctx.fillStyle='#b47c55';ctx.beginPath();ctx.arc(0,-38,18,0,7);ctx.fill();ctx.fillStyle='#ead4b7';ctx.beginPath();ctx.ellipse(0,-31,11,9,0,0,7);ctx.fill();ctx.fillStyle='#263044';for(let k of [-7,7]){ctx.beginPath();ctx.arc(k,-42,2.5,0,7);ctx.fill()}ctx.beginPath();ctx.arc(0,-33,3,0,7);ctx.fill();rounded(-13,-2,11,9,3,'#614536');rounded(3,-2,11,9,3,'#614536');ctx.fillStyle='#eb666e';ctx.fillRect(-17,-21,34,6);ctx.restore()}function draw(){background();ctx.save();ctx.translate(-cam,0);for(let p of plats){rounded(p.x,p.y,p.w,15,5,levels[world].floor);rounded(p.x,p.y+12,p.w,6,2,'#866c59')}coins.forEach((x,i)=>{if(!collected.has(i)){star(x,ground-76+(Math.sin(Date.now()/350+i)*4),13)}});boxes.forEach((x,i)=>{if(solved.has(i)){rounded(x,ground-52,51,50,8,'#81c4a0');ctx.fillStyle='#fff';ctx.font='bold 35px sans-serif';ctx.fillText('✓',x+9,ground-15)}else{rounded(x,ground-54,52,52,9,'#f3ad54');rounded(x+5,ground-49,42,42,6,'#ffd37d');ctx.fillStyle='#885124';ctx.textAlign='center';ctx.font='bold 34px sans-serif';ctx.fillText('?',x+26,ground-12);ctx.textAlign='left'}});const exit=2075;rounded(exit,ground-134,81,134,14,answered===4?'#69c1b1':'#67748e');rounded(exit+12,ground-110,57,110,12,'#fff8db');ctx.fillStyle='#455b86';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(answered===4?'OPEN':'LOCKED',exit+41,ground-147);ctx.textAlign='left';ctx.font='bold 55px serif';ctx.fillText('🏰',exit-4,ground-170);if(answered<4){ctx.font='25px sans-serif';ctx.fillText('🔒',exit+24,ground-50)}bear(player.x+17,player.y+48);particles.forEach(p=>star(p.x,p.y,5));ctx.restore();ctx.fillStyle='#234b7799';ctx.font='bold 14px system-ui';ctx.fillText('Collect stars ⭐  •  Find orange question boxes 📦',18,25)}function physics(dt){let acc=.68*dt;player.vx=(held.right?4:0)-(held.left?4:0);if(player.vx)player.face=player.vx>0?1:-1;player.x=Math.max(0,Math.min(worldEnd-player.w,player.x+player.vx*dt));if(held.jump&&player.onGround){player.vy=-12.7;player.onGround=false;beep(350,.07)}let oldBottom=player.y+player.h;player.vy+=acc;player.y+=player.vy*dt;player.onGround=false;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true}for(let p of plats){if(player.vy>=0&&oldBottom<=p.y+8&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.onGround=true}}cam=Math.min(worldEnd-W,Math.max(0,player.x-220));coins.forEach((x,i)=>{if(!collected.has(i)&&Math.abs(player.x+17-x)<30&&Math.abs(player.y+23-(ground-76))<72){collected.add(i);score+=2;emit(x,ground-76,4);beep(880,.08);updateHUD()}});for(let i=0;i<boxes.length;i++){if(!solved.has(i)&&Math.abs(player.x+17-(boxes[i]+26))<47&&player.y+player.h>ground-90){challenge(i);break}}if(player.x>2035){if(answered===4){nextLevel()}else{player.x=1995;player.vx=0;}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.24*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(mode==='play')physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function key(e,on){const map={'ArrowLeft':'left','a':'left','A':'left','ArrowRight':'right','d':'right','D':'right','ArrowUp':'jump','w':'jump','W':'jump',' ':'jump'};let action=map[e.key];if(action){e.preventDefault();held[action]=on}}document.addEventListener('keydown',e=>key(e,true));document.addEventListener('keyup',e=>key(e,false));window.addEventListener('blur',()=>Object.keys(held).forEach(k=>held[k]=false));for(const [id,key] of [['left','left'],['right','right'],['jump','jump']]){const b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();held[key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[key]=false)}el('restartBtn').onclick=()=>{world=0;score=0;resetLevel();startIntro()};el('soundBtn').onclick=()=>{sound=!sound;el('soundBtn').textContent=sound?'🔊 Sound on':'🔇 Sound off'};updateHUD();startIntro();})();
</script></body></html>
